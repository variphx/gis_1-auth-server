server:
  port: 9000

logging:
  level:
    org.springframework.security: DEBUG

spring:
  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
